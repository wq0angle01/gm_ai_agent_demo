# =============================================================================
# 账号密码在同目录的 secrets.properties 里（已 gitignore、不会打进 jar），
# =============================================================================

spring.application.name=gm-demo
server.port=8080

# 把本地凭据文件注入进来，供下面的 ${...} 占位符解析
spring.config.import=optional:file:./secrets.properties

# --- 阿里云 RDS MySQL ---
spring.datasource.url=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DB}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
# 真实值只在 secrets.properties，这里永远是占位符
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# RDS 对单个账号有连接数上限，本机开发 8 个足够
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.pool-name=gm-mysql-pool

# 演示数据由 SQL 脚本提供，不写在 Java 代码里
# MP 不建表，表结构已在 RDS 上存在（历史由 Hibernate ddl-auto 创建），后续 schema 变更需手动 ALTER 或引入 Flyway
# encoding 显式声明，避免脚本里的中文按操作系统默认编码被读坏
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/seed.sql
spring.sql.init.encoding=UTF-8

# --- MyBatis-Plus ---
# 枚举按 name() 存取，兼容历史 Hibernate 建的 MySQL ENUM 列
mybatis-plus.configuration.default-enum-type-handler=org.apache.ibatis.type.EnumTypeHandler
# 主键沿用数据库 AUTO_INCREMENT，不用 MP 默认雪花 ID
mybatis-plus.global-config.db-config.id-type=auto
# 驼峰↔下划线自动映射（默认已开，写出来作提示）
mybatis-plus.configuration.map-underscore-to-camel-case=true
# 把 Mapper 所在包开 DEBUG，控制台即可看到 MP 执行的每条 SQL（上生产前关掉）
logging.level.com.gm.demo.repository=DEBUG

# --- LLM（Phase B：DeepSeek 聊天 + DashScope Embedding + RAG 向量检索）---
# sk-none 是兜底默认值：没有 Key 时应用照样启动，只有真调模型才会失败
spring.ai.deepseek.api-key=${DEEPSEEK_API_KEY:sk-none}
spring.ai.deepseek.chat.options.model=deepseek-chat
# 运营问答要稳定，不要发散
spring.ai.deepseek.chat.options.temperature=0.2

# --- DashScope Embedding（RAG 向量检索用，免费额度仅华北2北京且需非 sk-sp- 开头密钥）---
spring.ai.dashscope.api-key=${DASHSCOPE_API_KEY:sk-none}
spring.ai.dashscope.embedding.options.model=text-embedding-v3
# 双 ChatModel 冲突：dashscope starter 会装配一个 ChatModel 跟 DeepSeek 撞，必须排除
# spring.ai.dashscope.chat.enabled=false 在该 starter 不生效，只能用 exclude
spring.autoconfigure.exclude=com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeChatAutoConfiguration

# Swagger 界面与 OpenAPI 文档的地址
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# 强制请求与响应都用 UTF-8，保证错误体里的中文消息不乱码
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
